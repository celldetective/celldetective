name: unitary tests

on:
  push:

jobs:
  Linux-Full:
    name: Linux Full
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    env:
      DISPLAY: ':99.0'
    environment:
      name: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb
      - name: Start Xvfb
        run: |
           /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1920x1200x24 -ac +extension GLX
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel PyQt5
      - name: Install package [Full]
        run: |
          pip install ".[all]"
      # The suite pulls its segmentation/signal models from Zenodo the first
      # time a test asks for one. Zenodo answers 5xx often enough that an
      # otherwise good commit fails on it, so keep the downloads between runs:
      # the key rolls when the tests change, and falls back to the newest
      # existing cache so a new model is added to it rather than re-fetched
      # every run.
      - name: Locate installed package
        id: pkg
        shell: bash
        run: |
          echo "dir=$(python -c 'import celldetective, os; print(os.path.dirname(os.path.realpath(celldetective.__file__)))')" >> "$GITHUB_OUTPUT"
      # Restore and save are split so the save runs even when the tests fail.
      # `actions/cache` only saves on success, so a job that loses one download
      # to a Zenodo 5xx threw away every model it did fetch, and the next run
      # started from nothing again. Push runs can only read caches from their
      # own branch and the default branch, so a new branch has nothing to fall
      # back on until one of its own runs saves.
      # Save keys are unique per run and record the job status, so a partial
      # set saved by a failed run never blocks a later save. Once a passing run
      # has saved for the current tests, restores prefer it and saving stops.
      - name: Restore Zenodo models and datasets
        id: zenodo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.pkg.outputs.dir }}/models/segmentation_targets
            ${{ steps.pkg.outputs.dir }}/models/segmentation_effectors
            ${{ steps.pkg.outputs.dir }}/models/segmentation_generic
            ${{ steps.pkg.outputs.dir }}/models/segmentation_oocyst
            ${{ steps.pkg.outputs.dir }}/models/signal_detection
            ${{ steps.pkg.outputs.dir }}/models/pair_signal_detection
            ${{ steps.pkg.outputs.dir }}/datasets
          key: celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-success
          restore-keys: |
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-success-
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Test package
        run: |
          python -m unittest
      - name: Test GUI
        run: |
          python tests/run_gui_tests.py
      - name: Save Zenodo models and datasets
        if: always() && !startsWith(steps.zenodo-cache.outputs.cache-matched-key, format('celldetective-zenodo-{0}-py{1}-{2}-success-', runner.os, matrix.python-version, hashFiles('tests/**/*.py')))
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.pkg.outputs.dir }}/models/segmentation_targets
            ${{ steps.pkg.outputs.dir }}/models/segmentation_effectors
            ${{ steps.pkg.outputs.dir }}/models/segmentation_generic
            ${{ steps.pkg.outputs.dir }}/models/segmentation_oocyst
            ${{ steps.pkg.outputs.dir }}/models/signal_detection
            ${{ steps.pkg.outputs.dir }}/models/pair_signal_detection
            ${{ steps.pkg.outputs.dir }}/datasets
          key: celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-${{ job.status }}-${{ github.run_id }}-${{ github.run_attempt }}

  Linux-Minimal:
    name: Linux Minimal
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel PyQt5
      - name: Install package [Minimal]
        run: |
          pip install "."
      - name: Test Partial Installation
        run: |
          python -m unittest tests/test_partial_install.py

  Linux-Preinstalled:
    name: Linux Pre-installed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pre-install TensorFlow
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.14.0
      - name: Install package [Base]
        run: |
          pip install "."
      - name: Verify Dependencies
        run: |
          python -c "import tensorflow; assert tensorflow.__version__ == '2.14.0', f'Tensorflow version mismatch: {tensorflow.__version__}'"
          python -c "import celldetective; print('Celldetective installed successfully on top of custom TF')"

  Windows-Full:
    name: Test Windows Full
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    environment:
      name: tests
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install setuptools wheel PyQt5
      - name: Install package [Full]
        run: |
          pip install -e ".[all]"
      # The suite pulls its segmentation/signal models from Zenodo the first
      # time a test asks for one. Zenodo answers 5xx often enough that an
      # otherwise good commit fails on it, so keep the downloads between runs:
      # the key rolls when the tests change, and falls back to the newest
      # existing cache so a new model is added to it rather than re-fetched
      # every run.
      - name: Locate installed package
        id: pkg
        shell: bash
        run: |
          echo "dir=$(python -c 'import celldetective, os; print(os.path.dirname(os.path.realpath(celldetective.__file__)))')" >> "$GITHUB_OUTPUT"
      # Restore and save are split so the save runs even when the tests fail.
      # `actions/cache` only saves on success, so a job that loses one download
      # to a Zenodo 5xx threw away every model it did fetch, and the next run
      # started from nothing again. Push runs can only read caches from their
      # own branch and the default branch, so a new branch has nothing to fall
      # back on until one of its own runs saves.
      # Save keys are unique per run and record the job status, so a partial
      # set saved by a failed run never blocks a later save. Once a passing run
      # has saved for the current tests, restores prefer it and saving stops.
      - name: Restore Zenodo models and datasets
        id: zenodo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.pkg.outputs.dir }}/models/segmentation_targets
            ${{ steps.pkg.outputs.dir }}/models/segmentation_effectors
            ${{ steps.pkg.outputs.dir }}/models/segmentation_generic
            ${{ steps.pkg.outputs.dir }}/models/segmentation_oocyst
            ${{ steps.pkg.outputs.dir }}/models/signal_detection
            ${{ steps.pkg.outputs.dir }}/models/pair_signal_detection
            ${{ steps.pkg.outputs.dir }}/datasets
          key: celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-success
          restore-keys: |
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-success-
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-
            celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Test package
        run: |
          python -m unittest
      - name: Test GUI
        run: |
          python tests/run_gui_tests.py
      - name: Save Zenodo models and datasets
        if: always() && !startsWith(steps.zenodo-cache.outputs.cache-matched-key, format('celldetective-zenodo-{0}-py{1}-{2}-success-', runner.os, matrix.python-version, hashFiles('tests/**/*.py')))
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.pkg.outputs.dir }}/models/segmentation_targets
            ${{ steps.pkg.outputs.dir }}/models/segmentation_effectors
            ${{ steps.pkg.outputs.dir }}/models/segmentation_generic
            ${{ steps.pkg.outputs.dir }}/models/segmentation_oocyst
            ${{ steps.pkg.outputs.dir }}/models/signal_detection
            ${{ steps.pkg.outputs.dir }}/models/pair_signal_detection
            ${{ steps.pkg.outputs.dir }}/datasets
          key: celldetective-zenodo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('tests/**/*.py') }}-${{ job.status }}-${{ github.run_id }}-${{ github.run_attempt }}

  Windows-Minimal:
    name: Test Windows Minimal
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    environment:
      name: tests
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install setuptools wheel PyQt5
      - name: Install package [Minimal]
        run: |
          pip install "."
      - name: Test Partial Installation
        run: |
          python -m unittest tests/test_partial_install.py

  Windows-Preinstalled:
    name: Test Windows Pre-installed
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    environment:
      name: tests
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Pre-install TensorFlow
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install tensorflow==2.14.0
      - name: Install package [Base]
        run: |
          pip install "."
      - name: Verify Dependencies
        run: |
          python -c "import tensorflow; assert tensorflow.__version__ == '2.14.0', f'Tensorflow version mismatch: {tensorflow.__version__}'"
          python -c "import celldetective; print('Celldetective installed successfully on top of custom TF')"
